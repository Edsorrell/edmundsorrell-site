- id: vestis
  client: Vestis
  title: NYSE Listing
  concept: false
  role: Group Creative Director, New York
  description: 'Activations for Vestis’s analyst day and bell ringing ceremony as the workplace supply company went public at the New York Stock Exchange. Built on the line “Others see dirty clothes. We see character,” each moment celebrated the people that make it all work. At analyst day, invented businesses came to life as vignettes, like Sandello’s Italian restaurant, where “30 orders of Nonna Sandello’s Lasagna in three hours” lit up a chef’s jacket splattered with tomato sauce. For the bell ringing ceremony we built an installation outside the exchange: a row of mock businesses, from a brass instrument repair shop to a cannoli bakery and a cancer research lab, each staffed by actors in role. Vestis employees, also played by actors, made the rounds delivering fresh uniforms and picking up the dirties in a tongue in cheek show that ended every five minutes in a street dance party, played on the instruments from the repair shop.'
  credit: ''
  rows:
