- id: procore-groundbreak
  client: Procore
  title: Groundbreak
  concept: false
  role: Group Creative Director, New York
  description: 'Groundbreak is Procore’s annual conference, and it arrived at a turning point for the company: a new leader, a sharper focus on product, and a deeper investment in the construction technology community it carries the flag for. We framed the brand for that moment across the whole event, from general sessions built around the product story to an expo floor that felt like a job site, with a timber framed arrival, an Innovation Roundup, a hidden speakeasy entered through a porta potty, a hat bar, a mental health installation and adoptable shelter dogs in Procore bandanas.'
  credit: ''
