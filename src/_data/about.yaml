intro_lead: Hi, I’m Ed.
intro_follow: Creative Director, Experiential & Spatial Design, based in San Francisco.
profile:
- For more than 20 years I’ve designed experiential environments and spatial systems for global brands, translating complexity into clear, structured experiences shaped by narrative and audience behavior.
- The work spans motor shows, customer experience centers, fan zones, interactive installations and brand environments, delivered across the US, Europe and Asia. I trained in engineering product design, so how a space is built matters to me as much as how it reads.
approach:
- title: Narrative
  text: 'Every space starts from a story: what the audience should understand, and in what order.'
- title: Spatial systems
  text: Zones, sequence and hierarchy organized as a system that can scale, or repeat across markets.
- title: Audience behavior
  text: Designed around how people move, gather and interact, from personal onboarding to collective moments.
success_label: A successful project is
success:
- title: Aesthetically engaging
  text: Considered in material, light and proportion at every scale.
- title: Holistically designed
  text: Architecture, media, light and sound working as one system.
- title: A cohesive concept
  text: A single spatial idea that organizes every zone and touchpoint.
- title: A clear message
  text: Complexity translated into a sequence audiences understand.
capabilities:
- Spatial systems and zoning
- Visitor journeys and sequencing
- Interactive installations
- Motor show and exhibition design
- Customer experience centers
- Brand environments and live events
